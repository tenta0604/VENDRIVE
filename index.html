<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111111"><title>VENDRIVE</title><style>body{margin:0;background:#e3e5e8;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;color:#111}.app{max-width:430px;min-height:100vh;margin:auto;background:#f4f5f6}.h{background:#fff;padding:18px;border-bottom:1px solid #e6e7e9}.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:11px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900}.name{font-size:19px;font-weight:900;letter-spacing:1.5px}.sub{font-size:11px;color:#777;margin-top:3px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:9px;background:#fff}.tabs button{border:0;border-radius:10px;padding:10px;font-weight:800}.tabs .on{background:#111;color:#fff}.main{padding:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.ey{font-size:9px;letter-spacing:1.2px;color:#888;font-weight:900}.title{font-size:23px;font-weight:900}.pill{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;font-size:11px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:14px 0}.day{border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px 0;font-weight:900}.day.on{background:#111;color:#fff}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.kpi,.card,.item{background:#fff;border:1px solid #e3e4e6;border-radius:15px;box-shadow:0 7px 22px #00000009}.kpi{padding:11px}.kpi span{font-size:10px;color:#888}.kpi b{display:block;font-size:21px}.map{height:330px;margin-top:10px;border-radius:20px;position:relative;overflow:hidden;border:1px solid #d9dadd;background:#e7e9ea;background-image:linear-gradient(25deg,transparent 47%,#fff 48%,#fff 52%,transparent 53%),linear-gradient(110deg,transparent 47%,#fff 48%,#fff 52%,transparent 53%);background-size:150px 150px,190px 190px}.label{position:absolute;top:10px;left:10px;background:#ffffffe8;border-radius:8px;padding:6px 8px;font-size:9px;font-weight:800}.pin{position:absolute;width:35px;height:35px;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 4px 12px #0003}.pin span{transform:rotate(45deg);color:#fff;font-size:10px;font-weight:900}.red{background:#e53935}.blue{background:#2979ff}.purple{background:#7c3aed}.orange{background:#f59e0b}.gray{background:#9ca3af;opacity:.45}.tools{position:absolute;right:9px;top:9px;display:grid;gap:5px}.tools button{width:36px;height:36px;border:1px solid #ddd;background:#fff;border-radius:10px;font-weight:900}.section{margin-top:15px}.headrow{display:flex;justify-content:space-between;align-items:center}.item{margin-top:7px;padding:12px;display:flex;justify-content:space-between;align-items:center}.item.done{opacity:.45}.item.order{border-color:#cfc1f3}.meta{font-size:10px;color:#888;margin-top:3px}.badge{font-size:9px;font-weight:900;padding:5px 7px;border-radius:99px}.br{background:#fee2e2;color:#b91c1c}.bp{background:#ede9fe;color:#6d28d9}.bg{background:#f0f1f2;color:#73777d}.hidden{display:none}.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end}.sheet.open{display:flex}.panel{background:#fff;width:100%;max-width:430px;margin:auto;border-radius:24px 24px 0 0;padding:18px;max-height:85vh;overflow:auto}.field{margin-top:12px}.field label{display:block;font-size:10px;color:#777;font-weight:900;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #ddd;border-radius:11px;background:#fafafa}.field textarea{height:80px}.actions{display:flex;gap:7px;margin-top:14px}.actions button{flex:1;padding:11px;border:1px solid #ddd;border-radius:11px;background:#fff;font-weight:900}.actions .primary{background:#111;color:#fff;border-color:#111}</style></head><body><div class="app"><div class="h"><div class="brand"><div class="logo">V</div><div><div class="name">VENDRIVE</div><div class="sub" id="date"></div></div></div></div><div class="tabs"><button class="on" data-t="map">マップ</button><button data-t="orders">オーダー</button><button data-t="machines">自販機</button></div><div class="main"><section id="map"><div class="row"><div><div class="ey">TODAY'S ROUTE</div><div class="title" id="today"></div></div><button class="pill" id="all">全ルート</button></div><div class="days" id="days"></div><div class="kpis"><div class="kpi"><span>未訪問</span><b>5</b></div><div class="kpi"><span>訪問済</span><b>2</b></div><div class="kpi"><span>オーダー</span><b>1</b></div></div><div class="map"><div class="label">MAP PREVIEW</div><div class="pin red" style="left:12%;top:58%"><span>A</span></div><div class="pin red" style="left:38%;top:67%"><span>B</span></div><div class="pin blue" style="left:68%;top:29%"><span>C</span></div><div class="pin gray" style="left:28%;top:20%"><span>D</span></div><div class="pin purple" style="left:77%;top:68%"><span>E</span></div><div class="pin orange" style="left:52%;top:44%"><span>F</span></div><div class="tools"><button>＋</button><button>−</button><button>⌖</button></div></div><div class="section"><div class="headrow"><b>今日の対象</b><span class="sub">木曜ルート</span></div><div class="item" onclick="openM('自販機 A')"><div><b>自販機 A</b><div class="meta">3日周期 ・ 指定なし</div></div><span class="badge br">未訪問</span></div><div class="item" onclick="openM('自販機 B')"><div><b>自販機 B</b><div class="meta">1週間に1回 ・ 14:00〜16:00</div></div><span class="badge br">未訪問</span></div><div class="item done"><div><b>自販機 D</b><div class="meta">3日周期 ・ 本日完了</div></div><span class="badge bg">訪問済</span></div><div class="item order"><div><b>自販機 E</b><div class="meta">通常：金曜 ・ 商品が出ない</div></div><span class="badge bp">オーダー</span></div></div></section><section id="orders" class="hidden"><div class="row"><div><div class="ey">URGENT</div><div class="title">オーダー</div></div><button class="pill">＋登録</button></div><div class="item order"><div><b>自販機 E</b><div class="meta">商品が出ないとの電話 ・ 24時間以内</div></div><span class="badge bp">対応待ち</span></div></section><section id="machines" class="hidden"><div class="row"><div><div class="ey">MACHINES</div><div class="title">自販機</div></div><button class="pill">＋追加</button></div><div class="item" onclick="openM('自販機 A')"><div><b>自販機 A</b><div class="meta">木曜 ・ 3日周期</div></div><span class="badge br">未訪問</span></div><div class="item"><div><b>自販機 B</b><div class="meta">木曜 ・ 1週間に1回</div></div><span class="badge br">未訪問</span></div></section></div><div class="sheet" id="sheet"><div class="panel"><div class="row"><div><div class="ey">MACHINE DETAIL</div><div class="title" id="mn"></div></div><button class="pill" onclick="closeM()">閉じる</button></div><div class="field"><label>訪問曜日</label><input value="木"></div><div class="field"><label>訪問周期</label><select><option>毎日</option><option>2日周期</option><option selected>3日周期</option><option>1週間に1回</option><option>2週間に1回</option><option>3週間に1回</option><option>1ヶ月に1回</option></select></div><div class="field"><label>訪問時間</label><input value="指定なし"></div><div class="field"><label>販売データ</label><textarea>コーラ 5本/日・お茶 7本/日</textarea></div><div class="field"><label>メモ</label><textarea>駐車スペースに注意</textarea></div><div class="field"><label>臨時対応</label><div class="actions"><button>訪問スキップ</button><button>臨時訪問</button></div></div><div class="actions"><button class="primary">保存</button><button>訪問完了</button><button onclick="location.href='https://www.google.com/maps'">経路</button></div></div></div></div><script>const w=['日','月','火','水','木','金','土'],d=new Date(),wd=w[d.getDay()];date.textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${wd}）`;today.textContent=wd+'曜日';['月','火','水','木','金','土','日'].forEach(x=>{let b=document.createElement('button');b.className='day '+(x===wd?'on':'');b.textContent=x+'曜';b.onclick=()=>{document.querySelectorAll('.day').forEach(q=>q.classList.remove('on'));b.classList.add('on');today.textContent=x+'曜日'};days.appendChild(b)});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(q=>q.classList.remove('on'));b.classList.add('on');['map','orders','machines'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==b.dataset.tab))});function openSheet(n){document.getElementById('mname').textContent=n;document.getElementById('sheet').classList.add('open')}function closeSheet(){document.getElementById('sheet').classList.remove('open')}</script></body></html>
