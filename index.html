<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes">
<title>VENDRIVE</title>
<style>
:root{--bg:#f4f5f6;--card:#fff;--ink:#111;--muted:#777;--line:#e4e5e7;--soft:#eef0f2;--shadow:0 10px 30px rgba(0,0,0,.06)}*{box-sizing:border-box}body{margin:0;background:#dfe2e6;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.head{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:15px 16px}.brand{display:flex;align-items:center;gap:10px}.mark{width:36px;height:36px;border-radius:11px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900}.name{font-size:19px;font-weight:900;letter-spacing:1.4px}.muted{font-size:11px;color:var(--muted);margin-top:3px}.tabs{position:sticky;top:67px;z-index:19;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:9px;background:#fff;border-bottom:1px solid var(--line)}.tabs button,.pill,.day,.secondary,.primary{border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px;font-weight:800}.tabs .active,.day.active,.primary{background:#111;color:#fff;border-color:#111}.main{padding:14px}.row{display:flex;justify-content:space-between;align-items:end;gap:8px}.ey{font-size:9px;letter-spacing:1.2px;color:#8a8c90;font-weight:900}.title{font-size:23px;font-weight:900;margin-top:2px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:14px 0}.day{padding:9px 0;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.kpi{padding:11px}.kpi span{font-size:10px;color:#888}.kpi b{display:block;font-size:21px;margin-top:2px}.map{height:330px;margin-top:10px;border-radius:20px;border:1px solid #d6d9dc;overflow:hidden;position:relative;background:#e7e9ea;background-image:linear-gradient(28deg,transparent 47%,#fff 48%,#fff 52%,transparent 53%),linear-gradient(108deg,transparent 47%,#fff 48%,#fff 52%,transparent 53%);background-size:150px 150px,190px 190px}.maptag{position:absolute;top:10px;left:10px;z-index:2;background:#ffffffe8;border-radius:9px;border:1px solid var(--line);padding:6px 8px;font-size:9px;font-weight:800}.route{position:absolute;height:5px;border-radius:999px;transform-origin:left;opacity:.6;z-index:1}.r0{background:#2563eb}.r1{background:#16a34a}.r2{background:#ea580c}.r3{background:#7c3aed}.r4{background:#db2777}.r5{background:#0891b2}.r6{background:#ca8a04}.pin{position:absolute;width:36px;height:36px;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 4px 12px #0003;z-index:3}.pin span{transform:rotate(45deg);color:#fff;font-size:10px;font-weight:900}.red{background:#e53935}.blue{background:#2979ff}.purple{background:#7c3aed}.orange{background:#f59e0b}.gray{background:#9ca3af;opacity:.45}.tools{position:absolute;right:9px;top:9px;z-index:4;display:grid;gap:5px}.tools button{width:36px;height:36px;border:1px solid #ddd;background:#fff;border-radius:10px;font-weight:900}.section{margin-top:15px}.sectionhead{display:flex;justify-content:space-between;align-items:center}.item{margin-top:7px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 16px rgba(0,0,0,.04);display:flex;justify-content:space-between;align-items:center}.item.done{opacity:.43}.item.order{border-color:#c8b8ea}.meta{font-size:10px;color:#888;margin-top:3px}.badge{font-size:9px;font-weight:900;padding:5px 7px;border-radius:99px}.b-red{background:#fee2e2;color:#b91c1c}.b-purple{background:#ede9fe;color:#6d28d9}.b-gray{background:#eff0f1;color:#73777d}.hidden{display:none!important}.modal{position:fixed;inset:0;z-index:50;background:#0007;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:430px;margin:auto;border-radius:24px 24px 0 0;padding:18px;max-height:88vh;overflow:auto}.field{margin-top:11px}.field label{display:block;font-size:10px;color:#777;font-weight:900;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #ddd;border-radius:11px;background:#fafafa}.field textarea{min-height:76px}.actions{display:flex;gap:7px;margin-top:14px}.actions button{flex:1}.notice{margin-top:10px;padding:11px;border-radius:13px;background:#f3f1f8;border:1px solid #ddd3ef;font-size:11px;color:#5a456f;font-weight:750}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;background:#111;color:#fff;border-radius:99px;padding:9px 13px;font-size:11px;font-weight:800;display:none}.toast.show{display:block}
</style>
</head>
<body>
<div class="app">
<header class="head"><div class="brand"><div class="mark">V</div><div><div class="name">VENDRIVE</div><div class="muted" id="dateLabel"></div></div></div></header>
<nav class="tabs"><button class="active" data-page="mapPage">マップ</button><button data-page="ordersPage">オーダー</button><button data-page="machinesPage">自販機</button></nav>
<main class="main">
<section id="mapPage"><div class="row"><div><div class="ey">TODAY'S ROUTE</div><div class="title" id="dayTitle"></div></div><button class="pill" id="allBtn">全ルート</button></div><div class="days" id="days"></div>
<div class="stats"><div class="kpi"><span>未訪問</span><b id="todoCount">0</b></div><div class="kpi"><span>訪問済</span><b id="doneCount">0</b></div><div class="kpi"><span>オーダー</span><b id="orderCount">0</b></div></div>
<div class="map" id="map"><div class="maptag" id="maptag"></div><div class="tools"><button id="zin">＋</button><button id="zout">−</button><button id="zreset">⌖</button></div></div>
<div class="section"><div class="sectionhead"><b>今日の対象</b><span class="muted" id="routeText"></span></div><div id="todayList"></div></div></section>
<section id="ordersPage" class="hidden"><div class="row"><div><div class="ey">URGENT</div><div class="title">オーダー</div></div><button class="pill" id="addOrder">＋登録</button></div><div class="notice">オーダーは通常ルートとは別枠。登録した自販機は曜日に関係なく表示されます。</div><div id="ordersList" class="section"></div></section>
<section id="machinesPage" class="hidden"><div class="row"><div><div class="ey">MACHINES</div><div class="title">自販機</div></div><button class="pill" id="addMachine">＋追加</button></div><div id="machinesList" class="section"></div></section>
</main></div>
<div class="modal" id="modal"><div class="sheet"><div class="row"><div><div class="ey">MACHINE DETAIL</div><div class="title" id="modalTitle"></div></div><button class="pill" id="closeModal">閉じる</button></div>
<div class="field"><label>自販機名</label><input id="fName"></div><div class="field"><label>訪問曜日（複数可）</label><input id="fDays" placeholder="例：月,木"></div><div class="field"><label>訪問周期</label><select id="fCycle"><option>毎日</option><option>2日周期</option><option>3日周期</option><option>1週間に1回</option><option>2週間に1回</option><option>3週間に1回</option><option>1ヶ月に1回</option></select></div><div class="field"><label>前回訪問日</label><input id="fLast" type="date"></div><div class="field"><label>訪問時間</label><input id="fTime"></div><div class="field"><label>販売データ</label><textarea id="fSales"></textarea></div><div class="field"><label>メモ</label><textarea id="fMemo"></textarea></div>
<div class="field"><label>臨時対応</label><div class="actions"><button class="secondary" id="skipBtn">訪問スキップ</button><button class="secondary" id="forceBtn">臨時訪問</button></div></div><div class="actions"><button class="primary" id="saveBtn">保存</button><button class="secondary" id="completeBtn">訪問完了</button><button class="primary" id="routeBtn">経路</button></div>
</div></div><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var WEEK=['日','月','火','水','木','金','土'];
var now=new Date();var today=fmtDate(now);var autoDay=WEEK[now.getDay()];
var selectedDay=autoDay;var showAll=false;var currentId=null;var zoomScale=1;
var CYCLES={'毎日':1,'2日周期':2,'3日周期':3,'1週間に1回':7,'2週間に1回':14,'3週間に1回':21,'1ヶ月に1回':30};
var machines=[
{id:'A',name:'自販機 A',days:['木'],cycle:'3日周期',last:'2026-08-24',time:'指定なし',sales:'コーラ 5本/日・お茶 7本/日',memo:'駐車スペースに注意'},
{id:'B',name:'自販機 B',days:['木'],cycle:'1週間に1回',last:'2026-08-20',time:'14:00〜16:00',sales:'コーヒー 8本/日・水 3本/日',memo:'午後指定'},
{id:'C',name:'自販機 C',days:['木'],cycle:'2週間に1回',last:'2026-08-13',time:'10:00〜12:00',sales:'水 10本/日・お茶 6本/日',memo:'午前中推奨'},
{id:'D',name:'自販機 D',days:['木'],cycle:'3日周期',last:today,time:'指定なし',sales:'コーラ 4本/日',memo:'本日補充完了',visited:true},
{id:'E',name:'自販機 E',days:['金'],cycle:'1週間に1回',last:'2026-08-21',time:'指定なし',sales:'お茶 6本/日',memo:'商品が出ないとの電話',order:'商品が出ないとの電話'},
{id:'F',name:'自販機 F',days:['月'],cycle:'2日周期',last:'2026-08-25',time:'指定なし',sales:'水 9本/日',memo:'在庫少なめ'}
];
try{var savedRaw=localStorage.getItem('vendrive_v2');if(savedRaw){var saved=JSON.parse(savedRaw);if(saved&&Array.isArray(saved.machines)){machines=saved.machines;if(saved.lastOpened!==today){machines.forEach(function(m){m.visited=false;m.skip=null;m.force=null});localStorage.setItem('vendrive_v2',JSON.stringify({lastOpened:today,machines:machines}))}}else if(Array.isArray(saved)){machines=saved}}}catch(e){}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function diffDays(a,b){return Math.floor((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000)}
function due(m){if(m.skip===today)return false;if(m.force===today)return true;if(m.order)return true;if(m.visited)return true;if(m.cycle==='毎日')return true;if(m.days.indexOf(selectedDay)<0)return false;return diffDays(today,m.last)>=CYCLES[m.cycle]}
function persist(){try{localStorage.setItem('vendrive_v2',JSON.stringify({lastOpened:today,machines:machines}))}catch(e){}}
function toast(msg){var e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},1500)}
function card(m){var cls='item'+(m.visited?' done':'')+(m.order?' order':'');var status=m.order?'オーダー':(m.visited?'訪問済':'未訪問');var badge=m.order?'b-purple':(m.visited?'b-gray':'b-red');var el=document.createElement('div');el.className=cls;el.innerHTML='<div><b>'+esc(m.name)+'</b><div class="meta">'+esc(m.cycle)+' ・ '+esc(m.time)+(m.order?' ・ '+esc(m.order):'')+'</div></div><span class="badge '+badge+'">'+status+'</span>';el.addEventListener('click',function(){openMachine(m.id)});return el}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function render(){document.getElementById('dateLabel').textContent=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日（'+autoDay+'）';document.getElementById('dayTitle').textContent=selectedDay+'曜日';document.getElementById('routeText').textContent=showAll?'全ルート':selectedDay+'曜ルート';document.getElementById('maptag').textContent=showAll?'MAP · ALL ROUTES':'MAP · '+selectedDay;document.getElementById('allBtn').textContent=showAll?'今日のルート':'全ルート';
var targets=machines.filter(function(m){return showAll||due(m)});var tl=document.getElementById('todayList');tl.innerHTML='';targets.forEach(function(m){tl.appendChild(card(m))});document.getElementById('todoCount').textContent=targets.filter(function(m){return !m.visited}).length;document.getElementById('doneCount').textContent=targets.filter(function(m){return m.visited}).length;document.getElementById('orderCount').textContent=machines.filter(function(m){return !!m.order}).length;
var ol=document.getElementById('ordersList');ol.innerHTML='';var os=machines.filter(function(m){return !!m.order});if(!os.length)ol.innerHTML='<div class="card" style="padding:13px;color:#777">未対応のオーダーはありません。</div>';else os.forEach(function(m){var el=document.createElement('div');el.className='item order';el.innerHTML='<div><b>'+esc(m.name)+'</b><div class="meta">'+esc(m.order)+' ・ 24時間以内</div></div><button class="badge b-purple">対応完了</button>';el.querySelector('button').addEventListener('click',function(e){e.stopPropagation();m.order=null;m.visited=true;m.last=today;persist();render();toast('オーダー対応完了')});el.addEventListener('click',function(){openMachine(m.id)});ol.appendChild(el)});
var ml=document.getElementById('machinesList');ml.innerHTML='';machines.forEach(function(m){ml.appendChild(card(m))});
var map=document.getElementById('map');Array.prototype.slice.call(map.querySelectorAll('.pin,.route')).forEach(function(p){p.remove()});
var routePos={月:[14,68,280,-18],火:[12,58,240,12],水:[18,42,300,4],木:[42,53,185,25],金:[14,78,320,-6],土:[22,30,260,18],日:[28,60,240,-26]};var routeDays=showAll?['月','火','水','木','金','土','日']:[selectedDay];routeDays.forEach(function(rd,ri){var rp=routePos[rd];var rl=document.createElement('div');rl.className='route r'+(['月','火','水','木','金','土','日'].indexOf(rd));rl.style.left=rp[0]+'%';rl.style.top=rp[1]+'%';rl.style.width=rp[2]+'px';rl.style.transform='rotate('+rp[3]+'deg)';rl.title=rd+'曜ルート';map.appendChild(rl)});targets.forEach(function(m,i){var p=document.createElement('button');p.className='pin '+(m.visited?'gray':m.order?'purple':m.time!=='指定なし'?'blue':['red','orange'][i%2]);p.style.left=(10+(i*15)%77)+'%';p.style.top=(20+(i*13)%65)+'%';p.innerHTML='<span>'+esc(m.id)+'</span>';p.addEventListener('click',function(){openMachine(m.id)});map.appendChild(p)});
}
function openMachine(id){currentId=id;var m=machines.find(function(x){return x.id===id});if(!m)return;document.getElementById('modalTitle').textContent=m.name;document.getElementById('fName').value=m.name;document.getElementById('fDays').value=m.days.join(',');document.getElementById('fCycle').value=m.cycle;document.getElementById('fLast').value=m.last;document.getElementById('fTime').value=m.time;document.getElementById('fSales').value=m.sales;document.getElementById('fMemo').value=m.memo;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open');currentId=null}
function saveMachine(){var m=machines.find(function(x){return x.id===currentId});if(!m)return;m.name=document.getElementById('fName').value.trim()||m.name;m.days=document.getElementById('fDays').value.split(',').map(function(x){return x.trim()}).filter(Boolean);m.cycle=document.getElementById('fCycle').value;m.last=document.getElementById('fLast').value||today;m.time=document.getElementById('fTime').value.trim()||'指定なし';m.sales=document.getElementById('fSales').value;m.memo=document.getElementById('fMemo').value;persist();closeModal();render();toast('保存しました')}
function completeVisit(){var m=machines.find(function(x){return x.id===currentId});if(!m)return;m.visited=true;m.last=today;m.skip=null;m.force=null;if(m.order)m.order=null;persist();closeModal();render();toast('訪問完了')}
function skipToday(){var m=machines.find(function(x){return x.id===currentId});if(!m)return;m.skip=today;m.force=null;persist();closeModal();render();toast('本日を訪問スキップ')}
function forceToday(){var m=machines.find(function(x){return x.id===currentId});if(!m)return;m.force=today;m.skip=null;m.visited=false;persist();closeModal();render();toast('臨時訪問に追加')}
function openRoute(){var m=machines.find(function(x){return x.id===currentId});if(!m)return;window.location.href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(m.name)}
function addMachine(){var id=prompt('新しい自販機ID（例：G）');if(!id)return;id=id.trim().toUpperCase();if(!/^[A-Z0-9_-]+$/.test(id)||machines.some(function(m){return m.id===id})){toast('IDが不正または重複しています');return}machines.push({id:id,name:'自販機 '+id,days:[selectedDay],cycle:'1週間に1回',last:today,time:'指定なし',sales:'',memo:''});persist();render();openMachine(id)}
function addOrder(){var id=prompt('オーダー対象の自販機ID（例：A）');if(!id)return;id=id.trim().toUpperCase();var m=machines.find(function(x){return x.id===id});if(!m){toast('自販機が見つかりません');return}var n=prompt('オーダー内容');if(n===null)return;m.order=n.trim()||'オーダー';m.visited=false;persist();render();toast('オーダー登録')}
document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');['mapPage','ordersPage','machinesPage'].forEach(function(id){document.getElementById(id).classList.add('hidden')});document.getElementById(b.dataset.page).classList.remove('hidden')})});
document.getElementById('allBtn').addEventListener('click',function(){showAll=!showAll;render()});
document.getElementById('days').innerHTML=['月','火','水','木','金','土','日'].map(function(x){return '<button class="day '+(x===autoDay?'active':'')+'" data-day="'+x+'">'+x+'曜</button>'}).join('');document.querySelectorAll('.day').forEach(function(b){b.addEventListener('click',function(){selectedDay=b.dataset.day;showAll=false;document.querySelectorAll('.day').forEach(function(x){x.classList.remove('active')});b.classList.add('active');render()})});
document.getElementById('closeModal').addEventListener('click',closeModal);document.getElementById('saveBtn').addEventListener('click',saveMachine);document.getElementById('completeBtn').addEventListener('click',completeVisit);document.getElementById('skipBtn').addEventListener('click',skipToday);document.getElementById('forceBtn').addEventListener('click',forceToday);document.getElementById('routeBtn').addEventListener('click',openRoute);document.getElementById('addMachine').addEventListener('click',addMachine);document.getElementById('addOrder').addEventListener('click',addOrder);
document.getElementById('zin').addEventListener('click',function(){zoomScale=Math.min(1.2,zoomScale+.08);document.getElementById('map').style.transform='scale('+zoomScale+')';document.getElementById('map').style.transformOrigin='center'});document.getElementById('zout').addEventListener('click',function(){zoomScale=Math.max(.86,zoomScale-.08);document.getElementById('map').style.transform='scale('+zoomScale+')'});document.getElementById('zreset').addEventListener('click',function(){zoomScale=1;document.getElementById('map').style.transform='scale(1)'});
render();
setInterval(function(){var n=new Date();if(fmtDate(n)!==today){location.reload()}},60000);
})();
</script></body></html>
